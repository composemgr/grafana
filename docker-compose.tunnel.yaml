name: grafana
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: grafana/grafana:latest
    container_name: grafana-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      GF_SERVER_ROOT_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
      GF_SERVER_HTTP_PORT: 3000
      GF_SECURITY_ADMIN_USER: ${APP_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${APP_ADMIN_PASS:-replace-with-a-random-password}
      GF_SECURITY_SECRET_KEY: ${APP_SECRET_KEY:-replace-with-a-random-password}
      GF_INSTALL_PLUGINS: ${GF_INSTALL_PLUGINS:-}
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}:${EMAIL_SERVER_PORT:-587}
      GF_SMTP_USER: ${EMAIL_SERVER_LOGIN_NAME:-}
      GF_SMTP_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      GF_SMTP_FROM_ADDRESS: ${EMAIL_SERVER_MAIL_FROM:-grafana@example.com}
      CONTAINER_NAME: grafana-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/grafana:/var/lib/grafana'
    user: '${SERVICE_USER:-1000}:${SERVICE_GROUP:-1000}'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://grafana-app:3000'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - grafana
      - cloudflare

networks:
  grafana:
    name: grafana
    external: false
  cloudflare:
    external: true
